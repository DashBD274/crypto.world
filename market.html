<style>
  :root {
    --bg-color: #0b0e11;
    --panel-color: #161a1e;
    --panel-hover: #1e2329;
    --text-color: #eaecef;
    --text-dim: #848e9c;
    --border-color: #2b3139;
    --gold: #f0b90b;
    --btn-text: #202630;
    --green: #0ecb81;
    --red: #f6465d;
  }

  [data-theme="light"] {
    --bg-color: #ffffff;
    --panel-color: #f5f5f5;
    --panel-hover: #e8e8e8;
    --text-color: #1a1a1a;
    --text-dim: #666666;
    --border-color: #dcdcdc;
    --gold: #d9a70a;
    --btn-text: #ffffff;
    --green: #0a9d62;
    --red: #d9304a;
  }

  * { box-sizing:border-box; }
  html { overflow-x: hidden; width: 100%; height: 100%; }
  
  body { 
    margin:0; font-family:Arial, sans-serif; 
    background: var(--bg-color); color: var(--text-color); 
    padding-bottom: calc(70px + env(safe-area-inset-bottom)); 
    width:100%; height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust:100%;
    touch-action: pan-y;
    position: fixed;
    inset: 0;
    transition: background 0.3s, color 0.3s;
  }

  #sticky-top { 
    position:fixed; top:0; left:0; right:0; z-index:1000; 
    background: var(--bg-color); 
    padding-top: calc(16px + env(safe-area-inset-top)); 
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    transition: background 0.3s;
  }

  header { 
    display:flex; align-items:center; justify-content:space-between; 
    padding: 0 20px 16px 20px; 
  }
  header h1 { font-size:20px; margin:0; }
  .icons { display:flex; align-items:center; gap:10px; }
  
  .icon-btn {
    background: transparent; border: 1px solid var(--border-color);
    color: var(--text-color); border-radius: 6px; padding: 6px 10px;
    cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px;
  }
  .icon-btn:hover { background: var(--panel-hover); }
  
  .lang-select {
    background: transparent; border: 1px solid var(--border-color);
    color: var(--text-color); border-radius: 6px; padding: 6px;
    cursor: pointer; font-size: 14px; outline: none;
  }
  .lang-select option { background: var(--panel-color); color: var(--text-color); }

  .deposit-btn {
    background: var(--gold); color: var(--btn-text); border:none;
    padding:8px 16px; border-radius:8px; font-weight:bold;
    font-size:13px; cursor:pointer; text-decoration:none;
    display:inline-block;
  }
  
  .tabs { 
    display:flex; gap:10px; padding:0 20px 12px; 
    overflow-x:auto; -webkit-overflow-scrolling:touch; 
  }
  .tabs button {
    background: var(--panel-hover); border:1px solid var(--border-color); color: var(--text-dim);
    padding:8px 16px; border-radius:20px; white-space:nowrap; cursor:pointer;
  }
  .tabs button.active { background: var(--gold); color: var(--btn-text); border-color: var(--gold); font-weight:bold; }
  
  .highlight-row { 
    display:flex; gap:12px; padding:16px 20px 16px; 
    overflow-x:auto; -webkit-overflow-scrolling:touch; 
  }
  .highlight-card {
    background: var(--panel-color); border-radius:10px; padding:12px 16px; min-width:130px;
  }
  .highlight-card .name { font-size:13px; color: var(--text-dim); }
  .highlight-card .price { font-size:16px; font-weight:bold; margin-top:4px; }
  
  table { width:100%; max-width:100%; border-collapse:collapse; table-layout:fixed; }
  th { text-align:left; color: var(--text-dim); font-size:13px; font-weight:normal; padding:8px 20px; }
  th:last-child, td:last-child { text-align:right; }
  td { padding:10px 20px; border-top:1px solid var(--border-color); overflow:hidden; }
  
  .coin-name { display:flex; align-items:center; gap:8px; font-weight:bold; min-width:0; cursor:pointer; }
  .coin-name img { width:24px; height:24px; border-radius:4px; flex-shrink:0; }
  .coin-name > div { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .coin-sub { color: var(--text-dim); font-size:12px; font-weight:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  
  .change-up { color: var(--green); }
  .change-down { color: var(--red); }
  canvas { display:block; max-width:100%; }
  
  .bottom-nav {
    position:fixed; bottom:0; left:0; right:0; background: var(--panel-color);
    display:flex; justify-content:space-around; 
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom)) 0;
    border-top:1px solid var(--border-color);
    z-index: 999;
    transition: background 0.3s;
  }
  .bottom-nav a { text-decoration:none; }
  .bottom-nav div { text-align:center; color: var(--text-dim); font-size:11px; cursor:pointer; }
  .bottom-nav div.active { color: var(--gold); }
  .bottom-nav .ic {
    font-size:18px; width:38px; height:38px; line-height:38px;
    margin:0 auto 2px; border-radius:50%; transition:0.2s;
  }
  .bottom-nav div.active .ic {
    background:rgba(240,185,11,0.15);
    box-shadow:0 0 0 6px rgba(240,185,11,0.08);
  }

  .support-icon-btn {
    width:36px; height:36px; border-radius:50%;
    background:#7C3AED; display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; user-select:none;
    box-shadow:0 2px 8px rgba(124,58,237,0.45);
  }
  .notif-icon-btn {
    width:36px; height:36px; border-radius:50%;
    background: var(--panel-hover); display:flex; align-items:center; justify-content:center;
    font-size:20px; cursor:pointer; user-select:none;
    color: var(--text-color); text-decoration:none;
    position: relative;
  }
  .notif-badge {
    position:absolute; top:-4px; right:-4px;
    background:var(--red); color:#fff; font-size:10px; font-weight:bold;
    min-width:16px; height:16px; border-radius:8px;
    display:none; align-items:center; justify-content:center;
    padding:0 4px; line-height:1;
  }
  .notif-badge.show { display:flex; }
  
  .support-menu {
    position:absolute; top:44px; right:0; background: var(--panel-hover); border:1px solid var(--border-color);
    border-radius:12px; min-width:200px; display:none; flex-direction:column;
    overflow:hidden; z-index:100; box-shadow:0 8px 20px rgba(0,0,0,0.45);
  }
  .support-menu.show { display:flex; }
  .support-menu button, .support-menu a {
    display:flex; align-items:center; gap:10px; padding:13px 16px;
    color: var(--text-color); text-decoration:none; background:none; border:none;
    font-size:14px; cursor:pointer; text-align:left; width:100%; font-family:inherit;
  }
  .support-menu button:hover, .support-menu a:hover { background: var(--border-color); }
  .support-menu .menu-divider { height:1px; background: var(--border-color); margin:0; }
  .support-menu .menu-ic { font-size:17px; width:20px; text-align:center; display:flex; align-items:center; justify-content:center; }
  .support-menu .menu-ic svg { width:18px; height:18px; display:block; }
  .support-menu a.live-support-item {
    background: var(--gold); color: var(--btn-text); font-weight:bold;
    border-radius:8px; margin:8px 8px 4px; width:calc(100% - 16px);
  }

  /* ★★★ চার্ট পপআপ (Modal) ★★★ */
  #chart-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg-color);
    z-index: 9999;
    flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) 16px 16px;
  }
  #chart-modal.active { display: flex; }
  
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .modal-header .coin-info {
    display: flex; align-items: center; gap: 8px;
    font-size: 18px; font-weight: bold;
  }
  .modal-header .coin-info img { width: 28px; height: 28px; border-radius: 50%; }
  .close-modal-btn {
    background: var(--panel-hover); border: none; color: var(--text-color);
    width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer;
  }

  .modal-chart-container {
    flex: 1;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel-color);
  }
  
  .modal-chart-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px;
    background: var(--panel-color);
    border-bottom: 1px solid var(--border-color);
  }
  .modal-chart-header .price { font-size: 22px; font-weight: bold; }
  .modal-chart-header .change { font-size: 14px; }
  .modal-chart-header .timeframe-select {
    background: var(--panel-hover); color: var(--text-color);
    border: 1px solid var(--border-color); border-radius: 6px;
    padding: 6px 10px; outline: none; font-size: 13px;
  }
  
  #modal-chart-container {
    width: 100%;
    height: calc(100% - 50px);
  }
</style>
</head>

<script>
let currentTab = 'crypto';

function adjustHeaderOffset(){
  const stickyTop = document.getElementById('sticky-top');
  const pageContent = document.getElementById('page-content');
  if (stickyTop && pageContent){
    pageContent.style.paddingTop = (stickyTop.offsetHeight + 10) + 'px';
  }
}
window.addEventListener('load', adjustHeaderOffset);
window.addEventListener('resize', adjustHeaderOffset);
adjustHeaderOffset();

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    if (currentTab === 'crypto' || currentTab === 'futures') {
      loadMarket();
    } else if (currentTab === 'forex') {
      loadForex();
    } else if (currentTab === 'stocks') {
      loadStocks();
    }
  });
});

const supportIcon = document.getElementById('support-icon');
const supportMenu = document.getElementById('support-menu');
supportIcon.addEventListener('click', (e) => {
  e.stopPropagation();
  supportMenu.classList.toggle('show');
});
supportMenu.addEventListener('click', (e) => e.stopPropagation());
document.addEventListener('click', () => supportMenu.classList.remove('show'));

let marketDataCache = [];

function drawSparkline(canvas, prices, up) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  if (!prices || prices.length < 2) return;
  const min = Math.min(...prices), max = Math.max(...prices);
  ctx.beginPath();
  prices.forEach((p,i) => {
    const x = (i/(prices.length-1))*w;
    const y = h - ((p-min)/((max-min)||1))*h;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  const style = getComputedStyle(document.documentElement);
  ctx.strokeStyle = up ? style.getPropertyValue('--green').trim() : style.getPropertyValue('--red').trim();
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

      return {

        short: coin.short,
        price: parseFloat(item.price_usd),

function renderMarket() {
  const tbody = document.getElementById('market-body');

    row.dataset.symbol = coin.symbol;

      <td>
        <div class="${up?'change-up':'change-down'} price-cell">${up?'+':''}${coin.changePercent.toFixed(2)}%</div>
        <div class="price-value">$${coin.price.toLocaleString(undefined,{maximumFractionDigits:4})}</div>
      </td>`;
    tbody.appendChild(row);

    const canvas = document.getElementById('chart-' + coin.symbol);
    if (canvas) {
      const prices = [];
      let p = coin.basePrice * 0.98;
      for (let i = 0; i < 24; i++) {
        p = p * (1 + (Math.random() - 0.48) * 0.01);
        prices.push(p);
      }
      drawSparkline(canvas, prices, up);
    }
  });
}

function simulateMarketUpdate() {
  if (marketDataCache.length === 0) return;
  marketDataCache.forEach(coin => {
    const randomFactor = (Math.random() - 0.5) * 0.001;
    coin.price = coin.basePrice * (1 + randomFactor);
    coin.changePercent = coin.baseChangePercent + (randomFactor * 100);

    const row = document.querySelector(`#market-body tr[data-symbol="${coin.symbol}"]`);
    if (row) {
      const priceEl = row.querySelector('.price-value');
      const changeEl = row.querySelector('.price-cell');
      if (priceEl) priceEl.textContent = '$' + coin.price.toLocaleString(undefined, {maximumFractionDigits: 4});
      if (changeEl) {
        const up = coin.changePercent >= 0;
        changeEl.className = up ? 'change-up price-cell' : 'change-down price-cell';
        changeEl.textContent = (up ? '+' : '') + coin.changePercent.toFixed(2) + '%';
      }
    }
  });
}

async function loadForex() {
  const tbody = document.getElementById('market-body');
  const highlightRow = document.getElementById('highlight-row');
  tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--text-dim);">Loading...</td></tr>';
  highlightRow.innerHTML = '';

  const dateStrs = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    dateStrs.push(d.toISOString().split('T')[0]);
  }

  const bases = [...new Set(forexList.map(f => f.base))];
  const seriesByBase = {};
  let anySuccess = false;
  let lastError = '';

  await Promise.all(bases.map(async base => {
    const symbols = forexList.filter(f => f.base === base).map(f => f.quote).join(',');
    try {
      const results = await Promise.all(dateStrs.map(async date => {
        const res = await fetch(`https://api.frankfurter.dev/v1/${date}?base=${base}&symbols=${symbols}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }));
      seriesByBase[base] = results.map(r => r.rates);
      anySuccess = true;
    } catch (err) {
      lastError = err.message;
      seriesByBase[base] = null;
    }
  }));

  if (!anySuccess) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--red);">Could not load forex data (' + lastError + ').</td></tr>';
    return;
  }

  tbody.innerHTML = '';

  forexList.forEach((fx, idx) => {
    const series = seriesByBase[fx.base];
    if (!series) return;
    const values = series.map(r => r[fx.quote]).filter(v => v !== undefined);
    if (values.length === 0) return;
    const latest = values[values.length - 1];
    const prevDay = values.length > 1 ? values[values.length - 2] : latest;
    const changePercent = ((latest - prevDay) / prevDay) * 100;
    const up = changePercent >= 0;

    if (idx < 3) {
      const hCard = document.createElement('div');
      hCard.className = 'highlight-card';
      hCard.innerHTML = `<div class="name">${fx.flag} ${fx.pair}</div><div class="price ${up?'change-up':'change-down'}">${latest.toLocaleString(undefined,{maximumFractionDigits:4})}</div>`;
      highlightRow.appendChild(hCard);
    }

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>
        <div class="coin-name" onclick="openChartModal('${fx.pair}', '${fx.pair}', '', 'forex')">
          <span style="font-size:20px;">${fx.flag}</span>
          <div>${fx.pair}<div class="coin-sub">${fx.base}/${fx.quote}</div></div>
        </div>
      </td>
      <td><canvas width="70" height="30" id="chart-fx-${fx.pair.replace('/','')}"></canvas></td>
      <td>
        <div class="${up?'change-up':'change-down'}">${up?'+':''}${changePercent.toFixed(2)}%</div>
        <div>${latest.toLocaleString(undefined,{maximumFractionDigits:4})}</div>
      </td>`;
    tbody.appendChild(row);

    const canvas = document.getElementById('chart-fx-' + fx.pair.replace('/',''));
    if (canvas && values.length > 1) drawSparkline(canvas, values, up);
  });
}

async function fetchStockWithRetry(symbol, retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`);
      if (res.status === 429) {
        await new Promise(r => setTimeout(r, 2000 * (attempt + 1)));
        continue;
      }
      if (!res.ok) return null;
      return await res.json();
    } catch (err) {
      await new Promise(r => setTimeout(r, 1000));
    }
  }
  return null;
}

async function loadModalChart() {
  if (!modalCurrentSymbol || !modalChart || !modalCandleSeries) return;
  try {
    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${modalCurrentSymbol}&interval=${modalInterval}&limit=100`);
    const klines = await res.json();
    if (!klines || klines.length === 0) return;
    
    try {
      const priceRes = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${modalCurrentSymbol}`);
      const priceData = await priceRes.json();
      const livePrice = parseFloat(priceData.price);
      if (!isNaN(livePrice)) {
        const last = klines[klines.length - 1];
        last[4] = String(livePrice);
        if (livePrice > parseFloat(last[2])) last[2] = String(livePrice);
        if (livePrice < parseFloat(last[3])) last[3] = String(livePrice);
      }
    } catch (e) {}
    
    const candleData = klines.map(k => ({
      time: Math.floor(k[0] / 1000),
      open: parseFloat(k[1]),
      high: parseFloat(k[2]),
      low: parseFloat(k[3]),
      close: parseFloat(k[4]),
    }));
    
    const volumeData = klines.map(k => ({
      time: Math.floor(k[0] / 1000),
      value: parseFloat(k[5]),
      color: parseFloat(k[4]) >= parseFloat(k[1]) ? 'rgba(14, 203, 129, 0.5)' : 'rgba(246, 70, 93, 0.5)',
    }));
    
    modalCandleSeries.setData(candleData);
    modalVolumeSeries.setData(volumeData);
    
    const last = klines[klines.length - 1];
    const prevClose = parseFloat(klines[klines.length - 2] ? klines[klines.length - 2][4] : klines[0][1]);
    const closeVal = parseFloat(last[4]);
    const changePercent = ((closeVal - prevClose) / prevClose) * 100;
    const up = changePercent >= 0;
    
    document.getElementById('modal-price').textContent = closeVal.toLocaleString(undefined, {maximumFractionDigits: 4}) + ' USD';
    const changeEl = document.getElementById('modal-change');
    changeEl.textContent = (up ? '+' : '') + changePercent.toFixed(2) + '%';
    changeEl.className = up ? 'change-up' : 'change-down';
    
  } catch (err) {
    console.error(err);
  }
}
