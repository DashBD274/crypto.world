<style>
  * { box-sizing:border-box; }
  html { overflow-x:hidden; width:100%; }
  
  body {
    margin:0; font-family:Arial, sans-serif; background:#0b0e11; color:#eaecef; 
    /* স্ট্যাটাস বারের নিচে যাতে বাটনগুলো না ঢোকে তাই প্যাডিং বাড়ানো হয়েছে */
    padding-bottom: calc(70px + env(safe-area-inset-bottom));
    overflow-x:hidden; width:100%; max-width:100vw;
    touch-action:pan-y; overscroll-behavior-x:none; overscroll-behavior-y:contain;
    -webkit-text-size-adjust:100%;
  }

  /* --- Sticky Top Fix --- */
  #sticky-top { 
    position:fixed; 
    top:0; 
    left:0; 
    right:0; 
    z-index:1000; 
    background:#0b0e11; 
    /* আইফোন ও অ্যান্ড্রয়েডের স্ট্যাটাস বার এড়াতে উপরে স্পেস দেওয়া হলো */
    padding-top: calc(16px + env(safe-area-inset-top)); 
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  header { 
    display:flex; align-items:center; justify-content:space-between; 
    padding: 0 20px 16px 20px; /* উপরের প্যাডিং 0 করে নিচে 16px */
  }
  header h1 { font-size:20px; margin:0; }
  .icons { display:flex; align-items:center; gap:12px; }
  .icons span, .icons a.icon-link { cursor:pointer; color:#eaecef; text-decoration:none; }
  .icon-wrap { position:relative; display:inline-block; }
  .notif-badge {
    position:absolute; top:-6px; right:-8px;
    background:#f6465d; color:#fff; font-size:10px; font-weight:bold;
    min-width:16px; height:16px; border-radius:8px;
    display:none; align-items:center; justify-content:center;
    padding:0 4px; line-height:1;
  }
  .notif-badge.show { display:flex; }
  
  .deposit-btn {
    background:#f0b90b; color:#202630; border:none;
    padding:8px 16px; border-radius:8px; font-weight:bold;
    font-size:13px; cursor:pointer; text-decoration:none;
    display:inline-block;
  }
  
  .tabs { 
    display:flex; gap:10px; padding:0 20px 12px; 
    overflow-x:auto; -webkit-overflow-scrolling:touch; 
  }
  .tabs button {
    background:#1e2329; border:1px solid #2b3139; color:#848e9c;
    padding:8px 16px; border-radius:20px; white-space:nowrap; cursor:pointer;
  }
  .tabs button.active { background:#f0b90b; color:#202630; border-color:#f0b90b; font-weight:bold; }
  
  /* --- Content --- */
  .highlight-row { 
    display:flex; gap:12px; padding:16px 20px 16px; 
    overflow-x:auto; -webkit-overflow-scrolling:touch; 
  }
  .highlight-card {
    background:#161a1e; border-radius:10px; padding:12px 16px; min-width:130px;

  .highlight-card .name { font-size:13px; color:#848e9c; }
  .highlight-card .price { font-size:16px; font-weight:bold; margin-top:4px; }
  
  table { width:100%; max-width:100%; border-collapse:collapse; table-layout:fixed; }
  th { text-align:left; color:#848e9c; font-size:13px; font-weight:normal; padding:8px 20px; }
  th:last-child, td:last-child { text-align:right; }
  td { padding:10px 20px; border-top:1px solid #1e2329; overflow:hidden; }
  
  .coin-name { display:flex; align-items:center; gap:8px; font-weight:bold; min-width:0; }

<script>
let currentTab = 'crypto';

function adjustHeaderOffset(){
  const stickyTop = document.getElementById('sticky-top');
  const pageContent = document.getElementById('page-content');
  if (stickyTop && pageContent){
    pageContent.style.paddingTop = stickyTop.offsetHeight + 'px';
  }
}
window.addEventListener('load', adjustHeaderOffset);
window.addEventListener('resize', adjustHeaderOffset);
adjustHeaderOffset();

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    if (currentTab === 'crypto' || currentTab === 'futures') {
      loadMarket();
    } else if (currentTab === 'forex') {
      loadForex();
    } else if (currentTab === 'stocks') {
      loadStocks();
    }
  });
});

let marketDataCache = [];

function drawSparkline(canvas, prices, up) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  if (!prices || prices.length < 2) return;
  const min = Math.min(...prices), max = Math.max(...prices);
  ctx.beginPath();
  prices.forEach((p,i) => {
    const x = (i/(prices.length-1))*w;
    const y = h - ((p-min)/((max-min)||1))*h;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.strokeStyle = up ? '#0ecb81' : '#f6465d';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

async function loadMarket() {
  const tbody = document.getElementById('market-body');
  const highlightRow = document.getElementById('highlight-row');
  try {
    const res = await fetch('https://api.coinlore.net/api/tickers/?limit=100');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const data = json.data;

    marketDataCache = coinList.map(coin => {
      const item = data.find(d => d.symbol === coin.symbol);
      if (!item) return null;
      return {
        symbol: coin.symbol,
        name: coin.name,
        short: coin.short,
        price: parseFloat(item.price_usd),
        basePrice: parseFloat(item.price_usd),
        changePercent: parseFloat(item.percent_change_24h),
        baseChangePercent: parseFloat(item.percent_change_24h)
      };
    }).filter(Boolean);

    renderMarket();
  } catch (err) {
    console.error(err);
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f6465d;">Error: ' + err.message + '</td></tr>';
  }
}

function renderMarket() {
  const tbody = document.getElementById('market-body');
  const highlightRow = document.getElementById('highlight-row');
  tbody.innerHTML = '';
  highlightRow.innerHTML = '';

  marketDataCache.forEach(coin => {
    const up = coin.changePercent >= 0;
    const iconUrl = 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color/' + coin.symbol.toLowerCase() + '.png';

    if (['BTC','ETH','XRP'].includes(coin.symbol)) {
      const hCard = document.createElement('div');
      hCard.className = 'highlight-card';
      hCard.innerHTML = `<div class="name">${coin.short}/USDT</div><div class="price ${up?'change-up':'change-down'}">$${coin.price.toLocaleString(undefined,{maximumFractionDigits:4})}</div>`;
      highlightRow.appendChild(hCard);
    }

    const row = document.createElement('tr');
    row.dataset.symbol = coin.symbol;
    row.innerHTML = `
      <td>
        <div class="coin-name">
          <img src="${iconUrl}" onerror="this.style.visibility='hidden'">
          <div>${coin.short}/USDT<div class="coin-sub">${coin.name}</div></div>
        </div>
      </td>
      <td><canvas width="70" height="30" id="chart-${coin.symbol}"></canvas></td>
      <td>
        <div class="${up?'change-up':'change-down'} price-cell">${up?'+':''}${coin.changePercent.toFixed(2)}%</div>
        <div class="price-value">$${coin.price.toLocaleString(undefined,{maximumFractionDigits:4})}</div>
      </td>`;
    tbody.appendChild(row);

    const canvas = document.getElementById('chart-' + coin.symbol);
    if (canvas) {
      const prices = [];
      let p = coin.basePrice * 0.98;
      for (let i = 0; i < 24; i++) {
        p = p * (1 + (Math.random() - 0.48) * 0.01);
        prices.push(p);
      }
      drawSparkline(canvas, prices, up);
    }
  });
}

function simulateMarketUpdate() {
  if (marketDataCache.length === 0) return;
  marketDataCache.forEach(coin => {
    const randomFactor = (Math.random() - 0.5) * 0.001;
    coin.price = coin.basePrice * (1 + randomFactor);
    coin.changePercent = coin.baseChangePercent + (randomFactor * 100);

    const row = document.querySelector(`#market-body tr[data-symbol="${coin.symbol}"]`);
    if (row) {
      const priceEl = row.querySelector('.price-value');
      const changeEl = row.querySelector('.price-cell');
      if (priceEl) priceEl.textContent = '$' + coin.price.toLocaleString(undefined, {maximumFractionDigits: 4});
      if (changeEl) {
        const up = coin.changePercent >= 0;
        changeEl.className = up ? 'change-up price-cell' : 'change-down price-cell';
        changeEl.textContent = (up ? '+' : '') + coin.changePercent.toFixed(2) + '%';
      }
    }
  });
}

async function loadForex() {
  const tbody = document.getElementById('market-body');
  const highlightRow = document.getElementById('highlight-row');
  tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#848e9c;">Loading...</td></tr>';
  highlightRow.innerHTML = '';

  const dateStrs = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    dateStrs.push(d.toISOString().split('T')[0]);
  }

  const bases = [...new Set(forexList.map(f => f.base))];
  const seriesByBase = {};
  let anySuccess = false;
  let lastError = '';

  await Promise.all(bases.map(async base => {
    const symbols = forexList.filter(f => f.base === base).map(f => f.quote).join(',');
    try {
      const results = await Promise.all(dateStrs.map(async date => {
        const res = await fetch(`https://api.frankfurter.dev/v1/${date}?base=${base}&symbols=${symbols}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }));
      seriesByBase[base] = results.map(r => r.rates);
      anySuccess = true;
    } catch (err) {
      lastError = err.message;
      seriesByBase[base] = null;
    }
  }));

  if (!anySuccess) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f6465d;">Could not load forex data (' + lastError + ').</td></tr>';
    return;
  }

  tbody.innerHTML = '';

  forexList.forEach((fx, idx) => {
    const series = seriesByBase[fx.base];
    if (!series) return;
    const values = series.map(r => r[fx.quote]).filter(v => v !== undefined);
    if (values.length === 0) return;
    const latest = values[values.length - 1];
    const prevDay = values.length > 1 ? values[values.length - 2] : latest;
    const changePercent = ((latest - prevDay) / prevDay) * 100;
    const up = changePercent >= 0;

    if (idx < 3) {
      const hCard = document.createElement('div');
      hCard.className = 'highlight-card';
      hCard.innerHTML = `<div class="name">${fx.flag} ${fx.pair}</div><div class="price ${up?'change-up':'change-down'}">${latest.toLocaleString(undefined,{maximumFractionDigits:4})}</div>`;
      highlightRow.appendChild(hCard);
    }

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>
        <div class="coin-name">
          <span style="font-size:20px;">${fx.flag}</span>
          <div>${fx.pair}<div class="coin-sub">${fx.base}/${fx.quote}</div></div>
        </div>
      </td>
      <td><canvas width="70" height="30" id="chart-fx-${fx.pair.replace('/','')}"></canvas></td>
      <td>
        <div class="${up?'change-up':'change-down'}">${up?'+':''}${changePercent.toFixed(2)}%</div>
        <div>${latest.toLocaleString(undefined,{maximumFractionDigits:4})}</div>
      </td>`;
    tbody.appendChild(row);

    const canvas = document.getElementById('chart-fx-' + fx.pair.replace('/',''));
    if (canvas && values.length > 1) drawSparkline(canvas, values, up);
  });
}

async function fetchStockWithRetry(symbol, retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_API_KEY}`);
      if (res.status === 429) {
        await new Promise(r => setTimeout(r, 2000 * (attempt + 1)));
        continue;
      }
      if (!res.ok) return null;
      return await res.json();
    } catch (err) {
      await new Promise(r => setTimeout(r, 1000));
    }
  }
  return null;
}

async function loadStocks() {
  const tbody = document.getElementById('market-body');
  const highlightRow = document.getElementById('highlight-row');
  tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#848e9c;">Loading... (this may take a moment)</td></tr>';
  highlightRow.innerHTML = '';

  if (!FINNHUB_API_KEY || FINNHUB_API_KEY === 'YOUR_FINNHUB_API_KEY_HERE') {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f6465d;">Please add your Finnhub API key in the code.</td></tr>';
    return;
  }

  tbody.innerHTML = '';
  let shown = 0;

  for (const s of stockList) {
    const q = await fetchStockWithRetry(s.symbol);
    if (!q || q.c === undefined || q.c === 0) {
      await new Promise(r => setTimeout(r, 400));
      continue;
    }

    const price = q.c;
    const changePercent = q.dp ?? 0;
    const up = changePercent >= 0;
    const logoUrl = `https://logo.clearbit.com/${s.domain}`;

    if (shown < 3) {
      const hCard = document.createElement('div');
      hCard.className = 'highlight-card';
      hCard.innerHTML = `<div class="name">${s.symbol}</div><div class="price ${up?'change-up':'change-down'}">$${price.toFixed(2)}</div>`;
      highlightRow.appendChild(hCard);
    }
    shown++;

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>
        <div class="coin-name">
          <img src="${logoUrl}" onerror="this.style.visibility='hidden'">
          <div>${s.symbol}<div class="coin-sub">${s.name}</div></div>
        </div>
      </td>
      <td><canvas width="70" height="30" id="chart-stock-${s.symbol}"></canvas></td>
      <td>
        <div class="${up?'change-up':'change-down'}">${up?'+':''}${changePercent.toFixed(2)}%</div>
        <div>$${price.toFixed(2)}</div>
      </td>`;
    tbody.appendChild(row);

    const canvas = document.getElementById('chart-stock-' + s.symbol);
    if (canvas) drawSparkline(canvas, [q.pc, q.l, q.o, q.h, q.c], up);

    await new Promise(r => setTimeout(r, 400));
  }

  if (tbody.innerHTML === '') {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f6465d;">Could not load stock data. Please try again shortly.</td></tr>';
  }
}

function updateNotifBadge() {
  const badge = document.getElementById('notif-badge');

  badge.textContent = total;

firebase.auth().onAuthStateChanged(user => {
  if (!user) return;

  const db = firebase.firestore();

  db.collection('deposits')
    .where('uid', '==', user.uid)
    .where('status', '==', 'pending')
    .onSnapshot(snap => {
      pendingDeposits = snap.size;
      updateNotifBadge();
    });

  db.collection('withdrawals')
    .where('uid', '==', user.uid)
    .where('status', '==', 'pending')
    .onSnapshot(snap => {
      pendingWithdrawals = snap.size;
      updateNotifBadge();
    });
});
