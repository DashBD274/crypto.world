<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Download App - Crypto World</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0b0e11; color: #eaecef;
    font-family: Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: fixed; inset: 0;
  }
  .container {
    text-align: center;
    padding: 30px;
    background: #161a1e;
    border-radius: 16px;
    width: 90%; max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .logo {
    width: 100px; height: 100px;
    margin: 0 auto 20px;
    border-radius: 22px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    border: 3px solid #f0b90b;
    overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  h1 { font-size: 24px; margin: 0 0 10px; color: #fff; }
  p { font-size: 14px; color: #848e9c; margin-bottom: 30px; line-height: 1.5; }
  
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 15px;
    background: #f0b90b; color: #202630;
    border: none; border-radius: 10px;
    font-size: 16px; font-weight: bold;
    cursor: pointer; transition: 0.2s;
    margin-bottom: 15px;
  }
  .btn:active { transform: scale(0.97); background: #d9a70a; }
  .btn-icon { font-size: 20px; }

  .instruction-box {
    display: none;
    background: #1e2329;
    border: 1px solid #474d57;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
    text-align: left;
    font-size: 13.5px;
    color: #eaecef;
    line-height: 1.6;
  }
  .instruction-box.active { display: block; }
  .instruction-box b { color: #f0b90b; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <img src="tradewallet.png" alt="Logo">
  </div>
  
  <h1>Crypto World App</h1>
  <p>Download our app for a faster, smoother, and safer trading experience.</p>

  <button class="btn" id="downloadBtn" onclick="startDownload()">
    <span class="btn-icon">⬇️</span> Download & Install App
  </button>

  <div class="instruction-box" id="instructionBox">
    <!-- নির্দেশনা এখানে জাভাস্ক্রিপ্ট দিয়ে বসানো হবে -->
  </div>
</div>

<script>
  // মোবাইল ডিটেকশন
  const userAgent = navigator.userAgent || navigator.vendor || window.opera;
  const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
  const isAndroid = /android/i.test(userAgent);

  function startDownload() {
    const btn = document.getElementById('downloadBtn');
    const box = document.getElementById('instructionBox');
    
    // বাটন ডিজেবল করা
    btn.innerHTML = '⏳ Preparing...';
    btn.style.opacity = '0.7';
    btn.disabled = true;

    setTimeout(() => {
      btn.style.display = 'none';
      box.classList.add('active');

      if (isIOS) {
        // iPhone এর জন্য নির্দেশনা
        box.innerHTML = `
          <b>📱 iPhone / iPad Instructions:</b><br><br>
          1. নিচের <b>Share</b> (শেয়ার) বাটনে ক্লিক করুন (স্ক্রিনের নিচে বা উপরে বক্সের মতো আইকন)।<br>
          2. স্ক্রল করে <b>"Add to Home Screen"</b> (হোম স্ক্রিনে যোগ করুন) এ ক্লিক করুন।<br>
          3. উপরে ডানদিকে <b>"Add"</b> এ ক্লিক করুন।<br><br>
          <i>(Safari ব্রাউজার থেকে সরাসরি অটো-ইনস্টল করা সম্ভব নয়।)</i>
        `;
      } else if (isAndroid) {
        // Android এর জন্য নির্দেশনা
        box.innerHTML = `
          <b>🤖 Android Instructions:</b><br><br>
          1. Chrome ব্রাউজারের ডানদিকের উপরে <b>3-Dot</b> (⋮) মেনুতে ক্লিক করুন।<br>
          2. <b>"Install app"</b> অথবা <b>"Add to Home screen"</b> এ ক্লিক করুন।<br>
          3. পপআপে <b>"Install"</b> এ ক্লিক করুন।<br><br>
          <i>(অ্যাপটি আপনার হোম স্ক্রিনে যুক্ত হয়ে যাবে)</i>
        `;
      } else {
        // ডেস্কটপের জন্য
        box.innerHTML = `
          <b>💻 Desktop Instructions:</b><br><br>
          এটি একটি মোবাইল অ্যাপ। অনুগ্রহ করে আপনার ফোনের ব্রাউজার (Chrome/Safari) দিয়ে এই লিংকে প্রবেশ করুন।
        `;
      }
    }, 1500);
  }
</script>

</body>
</html>
