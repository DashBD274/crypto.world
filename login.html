<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Log In - ABC Company</title>
<style>
  body { margin:0; font-family:Arial, sans-serif; background:#0b0e11; color:#eaecef; min-height:100vh; display:flex; align-items:center; justify-content:center; box-sizing:border-box; padding:20px; }
  .box { background:#161a1e; padding:40px; border-radius:12px; width:320px; max-width:100%; }
  .box h2 { margin-top:0; text-align:center; }
  .box input { width:100%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #474d57; background:#1e2329; color:#eaecef; box-sizing:border-box; font-size:16px; }
  .box button { width:100%; padding:12px; margin-top:10px; border:none; border-radius:6px; background:#f0b90b; color:#202630; font-weight:bold; cursor:pointer; }
  .msg { text-align:center; margin-top:10px; font-size:14px; }
  a { color:#f0b90b; }
  
  #loading-overlay { position:fixed; inset:0; background:#0b0e11; display:flex; align-items:center; justify-content:center; z-index:9999; }
  .spinner { width:40px; height:40px; border:4px solid #1e2329; border-top:4px solid #f0b90b; border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { 100% { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div></div>

<div class="box" style="display:none;" id="login-box">
  <h2>Log In</h2>
  <input type="text" id="phone" placeholder="Email or Phone number">
  <input type="password" id="password" placeholder="Password">
  <button onclick="logIn()">Log In</button>
  <p class="msg" id="msg"></p>
  <p class="msg">Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const ADMIN_EMAIL = "mrtiger6662@gmail.com";

const firebaseConfig = {
  apiKey: "AIzaSyDJoPr8RvE1xkNTKRr5kwTx6E51GCMn_HE",
  authDomain: "abc-company-6272a.firebaseapp.com",
  projectId: "abc-company-6272a",
  storageBucket: "abc-company-6272a.firebasestorage.app",
  messagingSenderId: "1026212780106",
  appId: "1:1026212780106:web:985ec1bc35837d6320eeb3"
};
firebase.initializeApp(firebaseConfig);

// ★★★ নতুন পরিবর্তন: পেজ লোড হওয়ার সাথে সাথে আগের সেশন মুছে ফেলা ★★★
// এর ফলে আপনি যখনই অ্যাপটি বন্ধ করে আবার খুলবেন, অ্যাপ আপনাকে সরাসরি মার্কেটে না পাঠিয়ে 
// সবসময় এই লগইন পেজটি দেখাবে।
firebase.auth().signOut().then(() => {
  localStorage.clear();
  sessionStorage.clear();
  
  document.getElementById('loading-overlay').style.display = 'none';
  document.getElementById('login-box').style.display = 'block';
}).catch((error) => {
  // যদি কোনো কারণে সাইনআউট না হয়, তবুও লগইন বক্স দেখাবে
  document.getElementById('loading-overlay').style.display = 'none';
  document.getElementById('login-box').style.display = 'block';
});

// মোবাইল কীবোর্ডের জন্য স্ক্রল ফিক্স
document.querySelectorAll('.box input').forEach(input => {
  input.addEventListener('focus', () => {
    setTimeout(() => {
      input.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  });
});

// লগইন ফাংশন
function logIn() {
  const identifier = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  
  if (!identifier || !password) {
    msg.style.color = 'red';
    msg.textContent = 'Please fill in all fields.';
    return;
  }
  
  const email = identifier.includes('@') ? identifier : identifier.replace(/\D/g,'') + '@abccompany-users.com';
  msg.style.color = '#f0b90b';
  msg.textContent = 'Logging in...';

  firebase.auth().signInWithEmailAndPassword(email, password)
    .then((cred) => {
      const destination = (cred.user.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase()
        ? 'admin.html'
        : 'market.html';
      window.location.replace(destination); // replace ব্যবহার করায় লগইনের পর ব্যাক বাটনে লগইন পেজে ফিরবে না
    })
    .catch(err => {
      msg.style.color = 'red';
      msg.textContent = err.message;
    });
}
</script>
</body>
</html>
