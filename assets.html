<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Assets - ABC Company</title>
<style>
  :root {
    --bg-color: #0b0e11;
    --panel-color: #161a1e;
    --panel-hover: #1e2329;
    --text-color: #eaecef;
    --text-dim: #848e9c;
    --border-color: #2b3139;
    --gold: #f0b90b;
    --btn-text: #202630;
    --green: #0ecb81;
    --red: #f6465d;
  }

  [data-theme="light"] {
    --bg-color: #ffffff;
    --panel-color: #f5f5f5;
    --panel-hover: #e8e8e8;
    --text-color: #1a1a1a;
    --text-dim: #666666;
    --border-color: #dcdcdc;
    --gold: #d9a70a;
    --btn-text: #ffffff;
    --green: #0a9d62;
    --red: #d9304a;
  }

  * { box-sizing:border-box; }
  html { 
    overflow-x: hidden; 
    width: 100%; 
    height: 100%;
  }
  
  body { 
    margin:0; font-family:Arial, sans-serif; 
    background: var(--bg-color); color: var(--text-color); 
    padding-bottom: calc(70px + env(safe-area-inset-bottom)); 
    width:100%; height: 100vh;
    overflow: hidden; /* মোবাইলে স্ক্রল বন্ধ */
    overscroll-behavior: none;
    -webkit-text-size-adjust:100%;
    touch-action: pan-y;
    position: fixed;
    inset: 0;
    transition: background 0.3s, color 0.3s;
  }

  header { 
    display:flex; align-items:center; justify-content:center; 
    padding: calc(16px + env(safe-area-inset-top)) 20px 16px; 
    position:relative; 
    background: var(--bg-color);
    border-bottom: 1px solid var(--border-color);
  }
  header h1 { font-size:20px; margin:0; color: var(--gold); }
  .header-controls {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    display: flex; gap: 8px; align-items: center;
  }
  .icon-btn, .lang-select {
    background: transparent; border: 1px solid var(--border-color);
    color: var(--text-color); border-radius: 6px; padding: 4px 6px;
    cursor: pointer; font-size: 12px; outline: none;
  }
  .lang-select option { background: var(--panel-color); color: var(--text-color); }

  /* কন্টেন্ট এরিয়া স্ক্রল হবে */
  #scroll-container {
    height: 100vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 80px;
  }

  .balance-card {
    background: var(--panel-color); border-radius:12px; margin:16px; padding:20px;
  }
  .balance-title {
    display:flex; align-items:center; gap:6px;
    color: var(--text-dim); font-size:14px; margin-bottom:16px;
  }
  .balance-amount {
    display:flex; align-items:baseline; gap:8px; margin-bottom:6px;
  }
  .balance-amount .num { font-size:32px; font-weight:bold; }
  .balance-amount .cur { color: var(--text-dim); font-size:15px; }
  .balance-usd { color: var(--text-dim); font-size:13px; margin-bottom:20px; }
  .balance-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .balance-actions button {
    background: var(--panel-hover); border:1px solid var(--border-color); color: var(--text-color);
    padding:12px 0; border-radius:8px; font-weight:bold; font-size:14px; cursor:pointer;
  }
  .balance-actions .btn-primary {
    background: var(--gold); color: var(--btn-text); border:1px solid var(--gold);
  }
  .balance-actions .btn-secondary {
    background:#2354b8; color:#ffffff; border:1px solid #2354b8;
  }

  .card { background: var(--panel-color); border-radius:12px; margin:16px; padding:20px; }
  .card-title {
    color: var(--text-dim); font-size:13px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-color); }
  .row:last-child { border-bottom:none; }
  .label { color: var(--text-dim); font-size:13px; }
  .value { font-weight:bold; word-break:break-all; text-align:right; max-width:60%; }

  /* Status badges for pending items */
  .status-badge {
    display:inline-block; padding:2px 10px; border-radius:12px;
    font-size:12px; font-weight:bold;
  }
  .status-pending {
    background:rgba(240,185,11,0.15); color: var(--gold);
  }
  .status-approved {
    background:rgba(14,203,129,0.15); color: var(--green);
  }
  .status-rejected {
    background:rgba(246,70,93,0.15); color: var(--red);
  }

  /* Profit / Loss badges for trades */
  .pl-badge {
    display:inline-block; padding:4px 10px; border-radius:8px;
    font-size:13px; font-weight:bold; white-space:nowrap;
  }
  .pl-profit { background:rgba(14,203,129,0.15); color: var(--green); }
  .pl-loss   { background:rgba(246,70,93,0.15); color: var(--red); }

  /* Trade summary (total profit / total loss) */
  .summary-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;
  }
  .summary-box {
    background: var(--panel-hover); border-radius:8px; padding:12px;
  }
  .summary-box .s-label { color: var(--text-dim); font-size:12px; margin-bottom:4px; }
  .summary-box .s-value { font-size:16px; font-weight:bold; }

  .bottom-nav {
    position:fixed; bottom:0; left:0; right:0; background: var(--panel-color);
    display:flex; justify-content:space-around; 
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom)) 0;
    border-top:1px solid var(--border-color);
    z-index: 999;
    transition: background 0.3s;
  }
  .bottom-nav a { text-decoration:none; }
  .bottom-nav div { text-align:center; color: var(--text-dim); font-size:11px; cursor:pointer; }
  .bottom-nav div.active { color: var(--gold); }
  .bottom-nav .ic {
    font-size:18px; width:38px; height:38px; line-height:38px;
    margin:0 auto 2px; border-radius:50%; transition:0.2s;
  }
  .bottom-nav div.active .ic {
    background:rgba(240,185,11,0.15);
    box-shadow:0 0 0 6px rgba(240,185,11,0.08);
  }
</style>
</head>
<body>

<header>
  <h1 data-i18n="assets">Assets</h1>
  <div class="header-controls">
    <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">
      <span id="theme-icon">🌙</span>
    </button>
    <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
      <option value="en">EN</option>
      <option value="bn">BN</option>
      <option value="hi">HI</option>
      <option value="zh">ZH</option>
      <option value="es">ES</option>
      <option value="ar">AR</option>
      <option value="fr">FR</option>
      <option value="pt">PT</option>
      <option value="ru">RU</option>
      <option value="ja">JA</option>
    </select>
  </div>
</header>

<div id="scroll-container">
  <div class="balance-card">
    <div class="balance-title">
      <span data-i18n="est_total_value">Est. Total Value</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </div>
    <div class="balance-amount">
      <span class="num" id="balanceNum">0.00</span>
      <span class="cur">USDT &#9662;</span>
    </div>
    <div class="balance-usd" id="balanceUsd">&#8776; $0.00</div>
  </div>

  <!-- Trades: profit / loss per trade -->
  <div class="card" id="trades-card">
    <div class="card-title"><span data-i18n="recent_trades">Recent Trades</span></div>
    <div id="trades-list">
      <div class="row"><span class="label">Loading...</span></div>
    </div>
    <div class="summary-grid">
      <div class="summary-box">
        <div class="s-label" data-i18n="total_profit">Total Profit</div>
        <div class="s-value" id="totalProfit" style="color:var(--green);">+0.00 USDT</div>
      </div>
      <div class="summary-box">
        <div class="s-label" data-i18n="total_loss">Total Loss</div>
        <div class="s-value" id="totalLoss" style="color:var(--red);">-0.00 USDT</div>
      </div>
    </div>
  </div>

  <div class="card" id="assets-card">
    <div class="row"><span class="label">Loading...</span></div>
  </div>
</div>

<div class="bottom-nav">
  <a href="market.html"><div><div class="ic">&#128200;</div><span data-i18n="market">Market</span></div></a>
  <a href="trade.html"><div><div class="ic">&#128179;</div><span data-i18n="trade">Trade</span></div></a>
  <div class="active"><div class="ic">&#128188;</div><span data-i18n="assets">Assets</span></div>
  <a href="profile.html"><div><div class="ic">&#128100;</div><span data-i18n="profile">Profile</span></div></a>
</div>

<!-- ★★★ lang-theme.js যুক্ত করা হলো ★★★ -->
<script src="lang-theme.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDJoPr8RvE1xkNTKRr5kwTx6E51GCMn_HE",
  authDomain: "abc-company-6272a.firebaseapp.com",
  projectId: "abc-company-6272a",
  storageBucket: "abc-company-6272a.firebasestorage.app",
  messagingSenderId: "1026212780106",
  appId: "1:1026212780106:web:985ec1bc35837d6320eeb3"
};
firebase.initializeApp(firebaseConfig);

// ---- Show cached data instantly ----
(function showCachedAssets() {
  try {
    const cached = JSON.parse(localStorage.getItem('assetsCache') || 'null');
    if (!cached) return;
    document.getElementById('balanceNum').textContent = cached.balance.toFixed(2);
    document.getElementById('balanceUsd').textContent = `≈ $${cached.balance.toFixed(2)}`;
    if (cached.tradesHtml !== undefined) {
      document.getElementById('trades-list').innerHTML = cached.tradesHtml;
      document.getElementById('totalProfit').textContent = cached.totalProfitText;
      document.getElementById('totalLoss').textContent = cached.totalLossText;
    }
    if (cached.assetsHtml !== undefined) {
      document.getElementById('assets-card').innerHTML = cached.assetsHtml;
    }
  } catch (e) {}
})();

function saveAssetsCache(patch) {
  try {
    const cached = JSON.parse(localStorage.getItem('assetsCache') || '{}');
    Object.assign(cached, patch);
    localStorage.setItem('assetsCache', JSON.stringify(cached));
  } catch (e) {}
}

firebase.auth().onAuthStateChanged(async user => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }

  // ---- Real-time balance listener ----
  firebase.firestore().collection('users').doc(user.uid)
    .onSnapshot(doc => {
      if (doc.exists) {
        const data = doc.data();
        const balance = data.balance || 0;
        document.getElementById('balanceNum').textContent = balance.toFixed(2);
        document.getElementById('balanceUsd').textContent = `≈ $${balance.toFixed(2)}`;
        saveAssetsCache({ balance });
      }
    });
  // -------------------------------------

  const db = firebase.firestore();

  function formatDate(ts) {
    if (!ts || !ts.toDate) return '—';
    const d = ts.toDate();
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) +
      ', ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  }

  function statusBadge(status) {
    if (status === 'approved') return { text: 'Success', cls: 'status-approved' };
    if (status === 'rejected') return { text: 'Reject', cls: 'status-rejected' };
    return { text: 'Pending', cls: 'status-pending' };
  }

  const tradesList = document.getElementById('trades-list');
  const totalProfitEl = document.getElementById('totalProfit');
  const totalLossEl = document.getElementById('totalLoss');

  function statusLabel(status) {
    if (status === 'completed') return 'Completed';
    if (status === 'pending') return 'Pending';
    if (status === 'error') return 'Error';
    return status;
  }

  function renderTradeRow(t) {
    const pending = t.status !== 'completed';
    const isProfit = t.profit >= 0;
    const sign = isProfit ? '+' : '';
    const badge = pending
      ? `<span class="status-badge status-pending">${statusLabel(t.status)}</span>`
      : `<span class="pl-badge ${isProfit ? 'pl-profit' : 'pl-loss'}">${sign}${t.profit.toFixed(2)} USDT</span>`;

    return `
      <div class="row">
        <span class="label">
          ${t.symbol}
          <div style="margin-top:4px; font-size:12px; color:var(--text-dim);">${t.date}</div>
          <div style="margin-top:2px; font-size:12px; color:var(--text-dim);">Ref: ${t.serial}</div>
        </span>
        <span class="value" style="text-align:right;">
          ${badge}
          ${pending ? '' : `<div style="margin-top:4px; font-size:12px; color:var(--text-dim);">${statusLabel(t.status)}</div>`}
        </span>
      </div>
    `;
  }

  function renderTrades(trades) {
    if (!trades.length) {
      tradesList.innerHTML = `<div class="row"><span class="label">No trades yet</span></div>`;
    } else {
      tradesList.innerHTML = trades.map(renderTradeRow).join('');
    }

    const completed = trades.filter(t => t.status === 'completed');
    const totalProfit = completed.filter(t => t.profit > 0).reduce((s, t) => s + t.profit, 0);
    const totalLoss = completed.filter(t => t.profit < 0).reduce((s, t) => s + t.profit, 0);
    totalProfitEl.textContent = `+${totalProfit.toFixed(2)} USDT`;
    totalLossEl.textContent = `${totalLoss.toFixed(2)} USDT`; 

    saveAssetsCache({
      tradesHtml: tradesList.innerHTML,
      totalProfitText: totalProfitEl.textContent,
      totalLossText: totalLossEl.textContent
    });
  }

  try {
    db.collection('trades')
      .where('uid', '==', user.uid)
      .onSnapshot(snap => {
        const trades = snap.docs.map(d => {
          const data = d.data();
          let profit = 0;
          if (data.result === 'win') profit = data.expectedReturn || 0;
          else if (data.result === 'lose') profit = -(data.amount || 0);
          return {
            symbol: data.symbol || '—',
            profit: profit,
            status: data.status || 'pending',
            date: formatDate(data.createdAt),
            serial: data.orderNumber || d.id
          };
        }).sort((a, b) => (b.date > a.date ? 1 : -1));
        renderTrades(trades);
      });
  } catch (e) {
    tradesList.innerHTML = `<div class="row"><span class="label">Failed to load trades</span></div>`;
  }

  const card = document.getElementById('assets-card');

  let deposits = [];
  let withdrawals = [];

  function renderRow(label, item) {
    const badge = statusBadge(item.status);
    return `
      <div class="row">
        <span class="label">
          ${label}
          <div style="margin-top:4px; font-size:12px; color:var(--text-dim);">${item.date}</div>
          <div style="margin-top:2px; font-size:12px; color:var(--text-dim);">Ref: ${item.serial}</div>
        </span>
        <span class="value">${item.amount.toFixed(2)} USDT <span class="status-badge ${badge.cls}">${badge.text}</span></span>
      </div>
    `;
  }

  function renderCard() {
    let rows = '';
    deposits.forEach(dep => { rows += renderRow('Deposit', dep); });
    withdrawals.forEach(wd => { rows += renderRow('Withdrawal', wd); });
    card.innerHTML = rows;
    saveAssetsCache({ assetsHtml: card.innerHTML });
  }

  try {
    db.collection('deposits')
      .where('uid', '==', user.uid)
      .onSnapshot(snap => {
        deposits = snap.docs.map(d => {
          const data = d.data();
          return {
            amount: data.claimedAmount || 0,
            date: formatDate(data.createdAt || data.timestamp),
            serial: data.referenceId || data.txnId || d.id,
            status: data.status || 'pending'
          };
        }).sort((a, b) => (b.date > a.date ? 1 : -1));
        renderCard();
      });

    db.collection('withdrawals')
      .where('uid', '==', user.uid)
      .onSnapshot(snap => {
        withdrawals = snap.docs.map(d => {
          const data = d.data();
          return {
            amount: data.amount || 0,
            date: formatDate(data.createdAt || data.timestamp),
            serial: data.referenceId || data.txnId || d.id,
            status: data.status || 'pending'
          };
        }).sort((a, b) => (b.date > a.date ? 1 : -1));
        renderCard();
      });
  } catch (e) {
    card.innerHTML = `<div class="row"><span class="label">Failed to load assets</span></div>`;
  }
});
</script>
</body>
</html>
